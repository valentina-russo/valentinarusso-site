name: Verifica accesso SSH all'hosting

# SupportHost dichiara accesso SSH su tutti i piani condivisi. Se le credenziali
# che il deploy usa via FTP valgono anche per SSH, dati come la quota di disco si
# leggono in un secondo invece di far camminare l'FTP su tutto l'albero.
#
# Prova pochi tentativi e si ferma: le protezioni anti forza bruta dell'hosting
# bloccano l'IP dopo qualche errore, e non vale la pena rischiare per un dato.

on:
  workflow_dispatch:

jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - name: Tenta SSH e leggi la quota
        env:
          HOST: ${{ secrets.ARUBA_FTP_HOST }}
          UTENTE: ${{ secrets.ARUBA_FTP_USER }}
          PAROLA: ${{ secrets.ARUBA_FTP_PASS }}
        run: |
          set -uo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

          # L'utente FTP puo' avere la forma utente@dominio: per SSH serve la
          # parte prima della chiocciola, che di solito e' l'utente cPanel.
          CORTO="${UTENTE%%@*}"

          for UT in "$UTENTE" "$CORTO"; do
            for PORTA in 22 2222; do
              echo "--- tentativo su porta $PORTA ---"
              if sshpass -p "$PAROLA" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=12 \
                   -o NumberOfPasswordPrompts=1 -p "$PORTA" "$UT@$HOST" \
                   'echo CONNESSO; echo "--- quota ---"; quota -s 2>/dev/null || echo "comando quota non disponibile"; echo "--- disco ---"; df -h . 2>/dev/null | tail -2; echo "--- occupato da public_html ---"; du -sh public_html 2>/dev/null' 2>&1 \
                   | grep -viE "password|$UTENTE|$CORTO"; then
                echo "OK: SSH risponde su $PORTA"
                exit 0
              fi
              echo "niente su questa porta"
            done
          done
          echo "SSH non raggiungibile con le credenziali FTP: resta l'FTP per queste misure"
