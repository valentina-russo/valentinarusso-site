name: Aggiorna riferimenti immagini nelle pagine
# Alcuni articoli vivono solo sul server e citano ancora i PNG pesanti:
# qui i riferimenti passano ai JPEG leggeri, senza toccare altro.
on:
  workflow_dispatch:
    inputs:
      applica:
        description: 'true per scrivere davvero, false per la prova'
        default: 'false'

jobs:
  immagini:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica, riscrivi, ricarica
        env:
          H: ${{ secrets.ARUBA_FTP_HOST }}
          U: ${{ secrets.ARUBA_FTP_USER }}
          P: ${{ secrets.ARUBA_FTP_PASS }}
          D: ${{ secrets.ARUBA_FTP_PATH }}
          APPLICA: ${{ github.event.inputs.applica }}
        run: |
          sudo apt-get install -y -q lftp >/dev/null
          mkdir -p pagine
          lftp -u "$U","$P" "$H" -e "set ssl:verify-certificate no; mirror --verbose=0 -I '*.md' ${D}user/pages pagine/; bye"
          echo "file markdown scaricati: $(find pagine -name '*.md' | wc -l)"
          python3 - <<'PY'
          import os, re
          nomi = ['blog-1','blog-2','blog-3','blog-4','blog-5','perche-ti-attrae-quella-persona',
                  'disegno-umano-carta-completa','come-leggere-carta-human-design',
                  '4-tipi-human-design-archetip','mammal-chart-cane','croce-incarnazione-human-design',
                  'libretto-cover-hero-16x9','firefly-double-exposure','costruttori-e-guide']
          cambiati = []
          for radice, _, file in os.walk('pagine'):
              for f in file:
                  if not f.endswith('.md'): continue
                  p = os.path.join(radice, f)
                  t = open(p, encoding='utf-8', errors='replace').read()
                  o = t
                  for n in nomi:
                      t = t.replace(n + '.png', n + '.jpg')
                  if t != o:
                      open(p, 'w', encoding='utf-8', newline='
').write(t)
                      cambiati.append(p)
          open('_cambiati.txt','w').write('
'.join(cambiati))
          print('pagine da aggiornare:', len(cambiati))
          for c in cambiati: print('  ', c)
          PY
          if [ "$APPLICA" != "true" ]; then echo '### prova soltanto, non ho scritto nulla'; exit 0; fi
          while read -r f; do
            [ -z "$f" ] && continue
            rel="${f#pagine/}"; dir="$(dirname "$rel")"; base="$(basename "$rel")"
            lftp -u "$U","$P" "$H" -e "set ssl:verify-certificate no; put -O ${D}user/pages/${dir} \"$f\" -o ${base}; bye" && echo "caricato ${rel}"
          done < _cambiati.txt
